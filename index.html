<!DOCTYPE html>
<html lang="id" class="w-full h-full overflow-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UJIAN ONLINE CBT-AKM</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .iframe-container {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Pulsing animation for logo */
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    .pulse-logo {
      animation: pulseGlow 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="w-full h-full relative bg-slate-950 text-slate-100 flex flex-col justify-between overflow-hidden">

  <!-- LOADING OVERLAY SCREEN -->
  <div id="loading-overlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 text-white p-6 transition-opacity duration-500">
    <div class="text-center space-y-5 max-w-md w-full">
      
      <!-- Animated Logo Icon -->
      <div class="w-20 h-20 mx-auto rounded-3xl bg-blue-600/20 border border-blue-400/30 flex items-center justify-center p-3 shadow-2xl backdrop-blur-md pulse-logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/9/9c/Logo_of_Ministry_of_Education_and_Culture_of_Republic_of_Indonesia.svg" alt="Logo Kemdikbud" class="max-h-full max-w-full object-contain">
      </div>

      <!-- Title & Subtitle -->
      <div class="space-y-1">
        <h1 class="text-xl font-black tracking-wider uppercase text-white">UJIAN ONLINE CBT-AKM</h1>
        <p class="text-xs text-blue-300 font-medium">Portal Ujian Digital & Integrasi Google Apps Script</p>
      </div>

      <!-- Spinner Indicator -->
      <div id="spinner-loader" class="flex items-center justify-center gap-2 pt-2">
        <div class="w-3 h-3 bg-amber-400 rounded-full animate-ping"></div>
        <div class="w-3 h-3 bg-blue-500 rounded-full animate-ping [animation-delay:0.2s]"></div>
        <div class="w-3 h-3 bg-indigo-500 rounded-full animate-ping [animation-delay:0.4s]"></div>
      </div>

      <!-- Status Info -->
      <div id="status-text" class="text-[11px] text-slate-400 font-mono pt-2 border-t border-white/10">
        Menghubungkan ke server aplikasi...
      </div>

    </div>
  </div>

  <!-- FULLSCREEN IFRAME CONTAINER -->
  <iframe 
    id="cbt-frame" 
    class="iframe-container"
    allow="autoplay; camera; microphone; geolocation; clipboard-read; clipboard-write; display-capture" 
    sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation"
    title="CBT AKM Pro Application">
  </iframe>

  <script>
    // URL Web App GAS Deploy Anda
    let GAS_URL = "https://script.google.com/macros/s/AKfycbxzgdyJM4piUbhfxjxOPtvZDc0nX4E6tG_5AP1I783ZkmJlYj7AfIrKbc5k3ah_V9pv/exec";

    // Load saved URL from LocalStorage if available
    const savedUrl = localStorage.getItem('cbt_gas_url');
    if (savedUrl && savedUrl.trim() !== '') {
      GAS_URL = savedUrl.trim();
    }

    function loadApplicationFrame() {
      const loader = document.getElementById('loading-overlay');
      const statusText = document.getElementById('status-text');
      const frame = document.getElementById('cbt-frame');

      if (statusText) statusText.innerText = "Memuat aplikasi...";

      const isDefaultUrl = !GAS_URL || GAS_URL.includes("URL_DEPLOY_GAS_ANDA_DISINI") || GAS_URL.trim() === "";

      if (!isDefaultUrl) {
        // Append cache buster parameter to ensure fresh load
        const targetUrl = GAS_URL + (GAS_URL.includes('?') ? '&' : '?') + 'redirect_source=github_pages&v=' + Date.now();
        frame.src = targetUrl;
      }

      // Handle iframe load event
      frame.onload = function() {
        if (statusText) statusText.innerText = "Aplikasi Siap!";
        dismissLoader();
      };

      // Auto dismiss splash screen
      setTimeout(function() {
        dismissLoader();
      }, isDefaultUrl ? 1200 : 3500);

      function dismissLoader() {
        if (loader && loader.style.display !== 'none') {
          loader.classList.add('opacity-0', 'pointer-events-none');
          setTimeout(function() {
            loader.style.display = 'none';
          }, 500);
        }
      }
    }

    // Run on page load
    window.onload = function() {
      loadApplicationFrame();
    };
  </script>
</body>
</html>
